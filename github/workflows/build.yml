name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Manual trigger button bhi milega

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (no wrapper jar needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew (if exists)
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LongToShortClipper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

