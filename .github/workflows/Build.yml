name: Build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship a preinstalled Android SDK with licenses accepted.
      - name: Install NDK and CMake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK (includes native whisper.cpp build)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a build_output.log

      - name: Build release APK (unsigned)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a build_output.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shortsclipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shortsclipper-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/
          if-no-files-found: ignore

      # CI logs are not fetchable from some restricted networks, so on failure we
      # commit the error summary back to the branch for visibility.
      - name: Publish error summary to branch (on failure)
        if: failure()
        run: |
          {
            echo "# CI error summary (${GITHUB_SHA::7})"
            grep -aE "^e: |error:|Caused by|FAILURE: Build failed|Execution failed for task|A problem occurred" build_output.log | sort -u | head -100
          } > ci-errors.md || true
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git add ci-errors.md
          git commit -m "CI error log [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} || true
