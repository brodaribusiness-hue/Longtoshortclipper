name: Build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDK_ROOT=${RUNNER_TEMP}/android-sdk
          mkdir -p "$SDK_ROOT/cmdline-tools"
          {
            echo "## SDK setup"
            echo '```'
            uname -a
            echo "ANDROID_HOME(before)=$ANDROID_HOME"
            which sdkmanager || echo "no sdkmanager on PATH"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip || {
            echo "cmdline-tools download FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          unzip -q /tmp/clt.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          export ANDROID_HOME=$SDK_ROOT
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK (includes native whisper.cpp build)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a build_output.log

      - name: Build release APK (unsigned)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a build_output.log

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Unit test results"
            find app/build/test-results -name "*.xml" | while read -r f; do
              head -3 "$f" | grep testsuite || true
            done | head -30
            echo "## Build tail"
            tail -5 build_output.log || true
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shortsclipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shortsclipper-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/
          if-no-files-found: ignore

      # CI raw logs are not fetchable from some restricted networks, so on failure
      # we put the error summary into the job step summary (fetchable via API).
      - name: Publish error summary (on failure)
        if: failure()
        run: |
          {
            echo "## ❌ Build errors (${GITHUB_SHA::7})"
            echo '```'
            grep -aE "^e: |error:|FAILED\b|Execution failed for task|FAILURE: Build failed|Caused by" build_output.log 2>/dev/null | sort -u | head -150
            echo '```'
            echo "## Last 40 log lines"
            echo '```'
            tail -40 build_output.log 2>/dev/null
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
