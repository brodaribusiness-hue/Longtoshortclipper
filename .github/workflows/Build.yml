name: Build

permissions:
  contents: read

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.3.11579264" "cmake;3.22.1" \
            "emulator" "system-images;android-30;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK and run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest --stacktrace 2>&1 | tee build_output.log

      # Use the maintained emulator action rather than open-coding AVD startup.
      # It handles the emulator's serial/port handshake and reports boot failures
      # with diagnostics, which is more reliable across changing hosted images.
      - name: Enable KVM access for emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi

      - name: Run Android emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          avd-name: shortsclipper-api30
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          disable-animations: true
          # android-emulator-runner executes this through /bin/sh; explicitly
          # select Bash because dash does not implement `set -o pipefail`.
          script: bash -o pipefail -c './gradlew --no-daemon connectedDebugAndroidTest --stacktrace 2>&1 | tee -a build_output.log'

      # Preserve focused diagnostics in the job summary and add one meaningful
      # check annotation. Do not turn successful Gradle task lines into errors:
      # that can hide the actual emulator or test failure.
      - name: Surface Android build diagnostics
        if: failure()
        run: |
          set +e
          error_lines=$(
            {
              grep -aE "^e: |error: |Execution failed for task|FAILURE: Build failed|Caused by:|^\* What went wrong:|^> Task .* FAILED" build_output.log 2>/dev/null
              # Connected-test failures are stored as JUnit XML rather than in
              # Gradle's concise exception, so include their exact message too.
              find app/build/outputs/androidTest-results app/build/test-results \
                -type f -name '*.xml' -exec grep -aH -E '<(failure|error)( |>)' {} + 2>/dev/null
            } | tail -100
          )
          {
            echo "## Android verification diagnostics"
            if [ -n "$error_lines" ]; then
              echo '```text'
              printf '%s\n' "$error_lines"
              echo '```'
            else
              echo "No Gradle error was captured. Inspect the failed emulator-action step above."
            fi
            echo "### Build-output tail"
            echo '```text'
            tail -100 build_output.log 2>/dev/null || true
            echo '```'
          } > /tmp/build-diagnostics.md
          cat /tmp/build-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$error_lines" ]; then
            first_error=$(printf '%s\n' "$error_lines" | tail -1 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Android build diagnostics::$first_error"
          else
            echo "::error title=Android verification failed::No Gradle error was captured; inspect the failed emulator-action step above."
          fi
          exit 0

      - name: Build unsigned release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease --stacktrace 2>&1 | tee -a build_output.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: shortsclipper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: shortsclipper-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-and-test-results
          path: |
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            build_output.log
            /tmp/android-emulator.log
          if-no-files-found: ignore
